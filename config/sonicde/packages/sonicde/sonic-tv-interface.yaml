sources:
    git:
        ref: origin/${master_branch}
        remotes:
            origin:
                url: ${sonicde_git}/${@basename}.git
                depth: ${sonic_depth}
                fetch: ${@SOLUTION::fetch::origin}
            upstream:
                url: ${plasma_git}/plasma-bigscreen.git
                depth: ${upstream_depth}
                fetch: ${@SOLUTION::fetch::upstream}
        config:
            autopick.enabled: 'true'
            autopick.upstream: upstream/Plasma/6.7
            autopick.master: origin/${master_branch}
            autopick.tracker: origin/tracking/plasma-6.7
            advice.detachedHead: 'false'
            remote.origin.tagOpt: --no-tags
            remote.upstream.tagOpt: --no-tags
        local-branch: ${master_branch}

master_branch: master

buildsystem: cmake

build-depends:
    - sonicde/sonic-frameworks-cmake-modules

depends:
    - 3rdparty/qcoro6
    - sonicde/sonic-activities
    - sonicde/sonic-activities-stats
    - sonicde/sonic-audio-applet-pulse
    - sonicde/sonic-file-search-ui
    - sonicde/sonic-frameworks-app-info
    - sonicde/sonic-frameworks-auth
    - sonicde/sonic-frameworks-autocomplete
    - sonicde/sonic-frameworks-bluetooth
    - sonicde/sonic-frameworks-core-addons
    - sonicde/sonic-frameworks-data-models
    - sonicde/sonic-frameworks-dbus
    - sonicde/sonic-frameworks-device-integration
    - sonicde/sonic-frameworks-icon-themes
    - sonicde/sonic-frameworks-internationalization
    - sonicde/sonic-frameworks-io
    - sonicde/sonic-frameworks-keybind
    - sonicde/sonic-frameworks-notifications
    - sonicde/sonic-frameworks-package
    - sonicde/sonic-frameworks-progress-ui
    - sonicde/sonic-frameworks-quick-ui
    - sonicde/sonic-frameworks-quick-ui-addons
    - sonicde/sonic-frameworks-settings
    - sonicde/sonic-frameworks-settings-ui
    - sonicde/sonic-frameworks-settings-utils
    - sonicde/sonic-frameworks-svg
    - sonicde/sonic-frameworks-text-codec
