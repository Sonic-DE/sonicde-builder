provides: kde/kwin-dbus-interface
sources:
    git:
        ref: origin/${master_branch}
        remotes:
            origin:
                url: ${sonicde_git}/${@basename}.git
                depth: ${sonic_depth}
                fetch: ${@SOLUTION::fetch::origin}
            upstream:
                url: https://invent.kde.org/plasma/kwin.git
                depth: ${upstream_depth}
                fetch: ${@SOLUTION::fetch::upstream}
        config:
            autopick.enabled: 'false'
            autopick.master: origin/${master_branch}
            advice.detachedHead: 'false'
            remote.origin.tagOpt: --no-tags
            remote.upstream.tagOpt: --no-tags
        local-branch: ${master_branch}

master_branch: master

buildsystem: cmake

build-depends:
    - sonicde/sonic-frameworks-cmake-modules
    - os-installed/libxcb

depends:
    - sonicde/sonic-decoration
    - sonicde/sonic-frameworks-idle-tracker
    - sonicde/sonic-frameworks-ipc
    - sonicde/sonic-frameworks-logging
    - sonicde/sonic-frameworks-settings-utils
    - sonicde/sonic-frameworks-svg
    - sonicde/sonic-keybind-daemon
    - sonicde/sonic-night-light
    - sonicde/sonic-silver
    - sys/libdrm

cmake-extra-args:
    - -DBUILD_TESTING=OFF
    - -DKWIN_BUILD_SCREENLOCKER=OFF
